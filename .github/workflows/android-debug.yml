name: Build All IN ONE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - english-bilingual

permissions:
  contents: write

concurrency:
  group: all-in-one-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  android:
    name: Android ARM64 optimized APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK and NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-arm64-release

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm tauri android init --ci

      - name: Build optimized release APK
        run: pnpm tauri android build --apk --target aarch64 --ci

      - name: Sign release APK with temporary test key
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          mkdir -p artifacts
          KEYSTORE="$RUNNER_TEMP/all-in-one-test.keystore"
          ALIGNED="$RUNNER_TEMP/all-in-one-aligned.apk"
          PASSWORD="allinone-temporary-test-key"

          keytool -genkeypair -noprompt -keystore "$KEYSTORE" \
            -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -alias allinone-test -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=All IN ONE Testing"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias allinone-test \
            --ks-pass "pass:$PASSWORD" --key-pass "pass:$PASSWORD" \
            --out "artifacts/All_IN_ONE_${VERSION}_arm64.apk" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "artifacts/All_IN_ONE_${VERSION}_arm64.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -f "$KEYSTORE" "$ALIGNED"
          ls -lh artifacts

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: All-IN-ONE-Android-ARM64
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: all-in-one-android-v${{ steps.apk.outputs.version }}-${{ github.run_number }}
          name: "All IN ONE Android test build ${{ steps.apk.outputs.version }} #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          body: |
            All IN ONE Android ARM64 optimized testing build.

            This release-profile APK is signed with a temporary test key for direct installation.
            It is not signed with a permanent private key and is not intended for Google Play publishing.
          files: artifacts/*.apk
